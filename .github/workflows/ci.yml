name: CI

# Every push to main builds, tests and packages. Pushing a tag vX.Y.Z (matching VERSION) also
# publishes the package as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      VULKAN_SDK_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v7
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          $p = Start-Process $installer -ArgumentList "--root `"$root`" --accept-licenses --default-answer --confirm-command install" -Wait -PassThru
          if ($p.ExitCode) { exit $p.ExitCode }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
      - name: Build, test and package
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --workflow --preset default
      - name: Check the packages
        run: powershell -NoProfile -File tests/package_test.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/packages/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: map
          path: build/feverscaler.map
          if-no-files-found: error

  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/settings_test.lua

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, settings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
          fi
          cd packages
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt \
            --title "FeverScaler $GITHUB_REF_NAME" --generate-notes
